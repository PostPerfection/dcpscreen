<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCP Screen Player</title>
  <link rel="stylesheet" href="/src/player.css" />
</head>
<body>
  <!-- the video is drawn under this see-through page -->
  <div id="preview-surface"></div>
  <!-- a playlist holding black or a still between rows -->
  <div id="player-hold" class="player-hold" hidden><img id="player-hold-still" alt="" hidden></div>
  <div id="player-hud" class="timeline-transport player-hud">
    <span id="player-row" class="player-row" hidden><span id="player-row-current"></span> <span id="player-row-next" class="player-row-next"></span></span>
    <button id="timeline-play-btn" class="btn-sm" title="Play/Pause">▶</button>
    <span id="player-hold-countdown" class="timecode player-hold-countdown"></span>
    <span id="timeline-position" class="timecode">00:00:00:00</span>
    <div id="timeline-scrubber" class="timeline-scrubber">
      <div class="timeline-scrubber-track">
        <div id="timeline-playhead" class="timeline-playhead" style="left: 0%"></div>
      </div>
    </div>
    <span id="timeline-duration" class="timecode" data-raw="0">00:00:00:00</span>
    <span id="player-hint" class="player-hint" hidden>Escape leaves full screen</span>
    <span id="player-decode-scale" class="player-hint" title="The resolution the picture decodes at" hidden></span>
    <button id="player-stereo-btn" class="btn-sm" title="Change what the 3D picture shows until the setting changes" hidden></button>
    <button id="player-subtitles-btn" class="btn-sm" title="Show or hide the composition's subtitles and captions" hidden></button>
    <button id="player-subtitle-language-btn" class="btn-sm" title="Show the subtitles in the composition's next language" hidden></button>
    <button id="player-stop-btn" class="btn-sm" title="Stop and close the player">⏹</button>
    <button id="player-fullscreen-btn" class="btn-sm" title="Full screen (F)">⛶</button>
  </div>
  <script type="module" src="/src/player.js"></script>
</body>
</html>
