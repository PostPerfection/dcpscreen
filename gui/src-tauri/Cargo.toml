[package]
name = "dcpscreen-gui"
version = "0.1.0"
description = "DCP Screen, a DCP screening player"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "dcpscreen_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
postkit-ffmpeg-link-search = { path = "../../extern/postkit/ffmpeg-link-search" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = "1"
dirs = "6"
postkit = { path = "../../extern/postkit" }
guikit = { path = "../../extern/guikit/rust" }
guikit-startup = { path = "../../extern/guikit/startup" }
dcpdoctor-core = { path = "../../extern/dcpdoctor/rust/crates/dcpdoctor-core" }
argon2 = "0.6.0"

[dev-dependencies]
tempfile = "3"

# tauri's CLI turns this off for `tauri dev` so the page comes from vite.
# production keeps it on so the webview serves the bundled frontend instead of
# localhost:1422, which is a blank window when vite is not running
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# guikit and dcpdoctor-core depend on postkit by git. pointing that at the
# submodule this build already compiles keeps postkit to one compile.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../../extern/postkit" }

# Optimize postkit in debug builds (color math is too slow unoptimized)
[profile.dev.package.postkit]
opt-level = 2
